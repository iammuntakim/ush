name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi zip

      - name: Process
        run: |
          chmod +x lib/arm64-v8a/*.so lib/armeabi-v7a/*.so
          for f in lib/arm64-v8a/*.so; do
            aarch64-linux-gnu-strip --strip-all --remove-section=.comment --remove-section=.note "$f"
            upx --best --ultra-brute "$f" || true
          done
          for f in lib/armeabi-v7a/*.so; do
            arm-linux-gnueabi-strip --strip-all --remove-section=.comment --remove-section=.note "$f"
            upx --best --ultra-brute "$f" || true
          done
          zip -r native.jar lib/

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Optimize binaries and package native.jar"
          branch: main
          file_pattern: "lib/ native.jar"
